<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Room Booking Form</title>
    <style>
      td {
        border: 0;
      }

      td input,
      select,
      textarea {
        width: 600px;
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <table width="60%" align="center" border="4" cellspacing="10">
      <caption>
        <h2>Hotel Room Booking Form</h2>
      </caption>
      <form action="">
      <tr>
        <td><label for="">Full Name</label></td>
        <td>:</td>
        <td>
          <input type="text" name="" id="" placeholder="Enter your name" />
        </td>
      </tr>

      <tr>
        <td><label for="">Email</label></td>
        <td>:</td>
        <td>
          <input type="email" name="" id="" placeholder="Enter your Email" />
        </td>
      </tr>

      <tr>
        <td><label for="">Phone</label></td>
        <td>:</td>
        <td>
          <input
            type="tel"
            name=""
            id=""
            placeholder="Enter your number"
            minlength="10"
            maxlength="10"
          />
        </td>
      </tr>

      <tr>
        <td><label for="">Check-in-date</label></td>
        <td>:</td>
        <td><input type="date" name="" id="" /></td>
      </tr>

      <tr>
        <td><label for="">Check-out-date</label></td>
        <td>:</td>
        <td><input type="date" name="" id="" /></td>
      </tr>

      <tr>
        <td><label for="">Room Type</label></td>
        <td>:</td>
        <td>
          <select name="" id="">
            <option value="">Single Room</option>
            <option value="">Double Room</option>
          </select>
        </td>
      </tr>

      <tr>
        <td><label for="">No of Guests</label></td>
        <td>:</td>
        <td><input type="number" name="" id="" min="1" /></td>
      </tr>

      <tr>
        <td>Special Request</td>
        <td>:</td>
        <td><textarea name="" id="" rows="6"></textarea></td>
      </tr>

      <tr>
        <td></td>
        <td></td>
        <td>
          <input type="submit" value="Submit Form" style="width: auto;" /> &nbsp;
          <input type="reset" value="Reset Form" style="width: auto;" />
        </td>
      </tr>
      </form>
    </table>
  </body>
</html>
