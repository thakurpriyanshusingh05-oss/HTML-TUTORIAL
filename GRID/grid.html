<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID LAYOUT 4</title>
    <style>
        body{
            margin:0;
            padding:0;
        }
        html,*{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        main{
            display:grid;
             grid-template-columns:repeat(1,1fr);
            gap:10px;
        }
        
        
        .BOX{
            background-color:#746767c4;
            height:100px;
            DISPLAY:FLEX;
            justify-content: center;
            align-items: center;
            font-size: 1.2em;
            
           
            
        }
        .container{
            background-color:#746767c4;
            height:100px;
            DISPLAY:FLEX;
            justify-content: center;
            align-items: center;
            font-size: 1.2em;
            
           
        }
        
    </style>
</head>
<body>
    <main>
        
        <div class="BOX"><h2>LOGO</h2></div>
        <div class="BOX"><h2>HEADER</h2></div>
        <div class="BOX"><h2>TEXT AREA</h2></div>
        
        
    </main>
    <div class="container"><h2>BOX 1</h2></div>
        

   
    
</body>
</html>
