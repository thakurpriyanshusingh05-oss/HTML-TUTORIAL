<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID-CONCEPT PRACTICE</title>
    <style>
        .container{
            display:grid;
            grid-template-columns:auto auto auto;
            padding:10px;
            background-color: dodgerblue;
        }
        .container div{
            background-color: #f1f1f1;
            border: 2px solid dodgerblue;
            padding:20px;
            text-align: center;
            margin:3px;
            font-size: 30px;


        }

    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>

    
</body>
</html>
