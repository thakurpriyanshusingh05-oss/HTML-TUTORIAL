<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hotel Room Booking Form</title>
        <style>
        td {
            Border:0;
        }
      td input,
      select,
      textarea {
       width:600px;
       padding:5px; 
      }  
    </style>
</head>
<body>
        <table width="60%" align="center" border="4" cellspacing="10">
                <caption>
                        <h1>Hotel Room Booking Form</h1>
                </caption>
                <form action="">
                        <tr>
                                <td><label for="">Full Name</label></td>
                                <td>:</td>
                                <td>
                                        <input type="text" name="" id="" placeholder="Enter Full Name"/>
                                </td>
                        </tr>
                        <tr>
                                <td><label for=""> Email</label></td>
                                <td>:</td>
                                <td>
                                        <input type="text" name="" id="" placeholder="Enter your Email"/>
                                </td>
                        </tr>
                        <tr>
                                <td><label for=""></label>Phone No.</td>
                                <td>:</td>
                                <td>
                                        <input type="Tel" name="" id="" placeholder="Enter phone no." minlength="10" maxlength="10"/>
                                </td>
                        </tr>
                        <tr>
                                <td><label for=""></label>Check in Date</td>
                                <td>:</td>
                                <td>
                                        <input type="date" name=""   id=""/>                       
                                       </td>
                        </tr>
                        <tr>
                                <td><label for="">Check out Date</label></td>
                                <td>:</td>
                                <td>
                                        <input type="date" name="" id=""/>
                                </td>
                        </tr>
                        <tr>
                                <td><label for="">Room Type</label></td>
                                <td>:</td>
                                <td>
                                        <select name="" id="">
                                        <option value="">Single Room</option>
                                        <option value="">Double room</option>
                                        </select>
                                </td>
                        </tr>
                        <tr>
                                <td><label for="">No of Guests</label></td>
                                <td>:</td>
                                <td>
                                        <input type="number" name="" id="" placeholder="no of guest" min="1"/>
                                </td>
                        </tr>
                        <tr>
                                <td><label> Special Request</label></td>
                                <td>:</td>
                                <td>
                                        <textarea name="" id="" cols="30" rows="5" placeholder="Enter your special request here"></textarea>
                                </td>
                        </tr>
                        <tr>
                                <td></td>
                                <TD></TD>
                                <td>
                                        <input type="Submit" value="Submit Form" style="width:auto"/>
                                        <input type="reset" value="Reset Form" style="width:auto"/>
                                </td>
                        </tr>
</body>
</html>
