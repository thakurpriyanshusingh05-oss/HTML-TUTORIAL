<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Registration Form</title> 
    
    
</head>
<body>
    
   <caption>
     <h1>Student Registration Form</h1>
     </caption>
     <form action="">
        <fieldset>
        <legend>Registration Form</legend>
        <br>
        <tr>
            <td><label for="">Full Name</label></td>
            <td>:</td>
            <td>
            <input type=" text" name="" id="" placeholder="Enter your full name"/>
            </td>
        </tr>
        <br/><br
        <tr>
            <td><label for="">Email</label></td>
            <td>:</td>
            <td>
                <input type="text" name="" id="" placeholder="Enter Your EMAIL"/>
            </td>
        </tr>
        
        <br /><br
        <tr>
            <td><label for="">Password</label></td>
            <td></td>
            <td>
                <input type="text" name="" id="" placeholder="Enter Password" minlength="5" maxlength="13"/>

            </td>
        </tr>
        <br /><br
        
        <tr>
            <td><label for=""> GENDER</label></td>
            <td>:</td>
            <td>
            <input type="radio" name="gender" id="" />Male
            <input type="radio" name="gender" id=""/>Female
            <input type="radio" name="gender" id=/> other
            </td>
        </tr>
        <br /><br
        <td><label for=""> Course</label></td>
        <td>:</td>
        <td>
        <select>
            <option value="Select Course">Select Course</option>
          <option value="Btech">Btech</option>
          <option value="BSC">BSC</option>
          <option value="Mtech">Mtech</option>
          <option value="MBA">MBA</option>
        </select>
        </td>
          <br /><br
          <tr>
            <td><label for="">Contact No.</label></td>
            <td>:</td>
            <td>
                <input type="Data" name="" id="" placeholder="Enter Phone No." minlength="10" maxlength="10"/>
            </td>
          </tr><br /><br
          <tr>
            <td><label for="">Address</label></td>
            <td>:</td>
            <br /><br
            <td>
                <textarea name="" id="" placeholder="Enter your address" rows="6"></textarea>
            </td>
          </tr><br /><br
          <tr>
            <td></td>
            <td></td>
            <td>
                <input type="Register" value="Register Form" style="width:auto"/>
                <input type="Clear" value="Clear Form" style="width:auto"/>
            </td>
          </tr>

        
</body>
</html>
