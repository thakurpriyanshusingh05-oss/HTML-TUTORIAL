<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        td {
            Border:0;
        }
      td input,
      select,
      textarea {
       width:600px;
       padding:5px; 
      }  
    </style>
</head>
<body>
    <table width="60%" align="center" border="4" cellspacing="10">
        <caption>
            <h1>HOTEL ROOM BOOKING FORM</h1>
        </caption>
        <Form action="">
            <tr>
                <td><LABEL For=""> Full Name</LABEL></td>
                <td>:</td>
                <td>
                    <input type="text" name="" id="" placeholder="Enter Your Full Name"/>
                </td>
            </tr>
            <tr>
                <td><label for="">Email</label></td>
                <td>:</td>
                <td>
                    <input type="Email" name="" id="" placeholder=" Enter Your Email" />
                </td>
            </tr>
            <tr>
                <td><label for=""> Phone NO.</label></td>
                <td>:</td>
                <td>
                    <input
                    type="Tel"
                    Name=""
                    id=""
                    Placeholder="Enter Your Phone NO."
                    minlength="10"
                    maxlength="10"
                    />

                </td>
            </tr>
            <tr>
                <td><label for=""> Check In Date</label></td>
                <td>:</td>
                <td>
                    <input type="date" name="" id="" />
                </td>
            </tr>
            <tr>
                <td><label for=""> Check Out Date</label></td>
                <td>:</td>
                <td>
                    <input type="Date" name="" id="" />
                </td>
            </tr>
            <tr>
                <td><label for=""> Room Type</label></td>
                <td>:</td>
                <td>
                <select name="" id="">
                    <option value="">Single Room</option>
                    <option value="">Double Room</option>
                </select>
                </td>
                
            </tr>
            <tr>
                <td><label for="">No. Of Guest</label></td>
                <td>:</td>
                <td>
                    <input type="" Name="" id="" Min="1"/>
                </td>
            </tr>
            <tr>
                <td><label for="">Special Request</label></td>
                <td>:</td>
                <td><textarea name="" id="" rows="6"></textarea></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td> 
                    <input type="Submit" Value="Submit Form" Style="width:auto"/>
                    <input type="Reset" Value="Reset Form" Style="width:auto"/>
                </td>
            </tr>

        

                     



</body>
</html>
